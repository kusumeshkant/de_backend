# ─────────────────────────────────────────────────────────────────────────────
# Azure UAT deployment — runs automatically when DEPLOY_PROVIDER=azure.
#
# Switching providers:
#   GitHub → Settings → Secrets and variables → Actions → Variables
#   Set DEPLOY_PROVIDER = azure   (this file runs)
#   Set DEPLOY_PROVIDER = render  (deploy-render-uat.yml runs instead)
#
# Branch strategy:  develop → UAT   |   main → Production (deploy.yml)
#
# STATUS 2026-07-16: DEPLOY_PROVIDER is currently 'render', so this job's
# `if` guard already no-ops it. The underlying Azure subscription (rg-dq-prod)
# no longer exists — this workflow will fail even if DEPLOY_PROVIDER is
# switched back to 'azure' until infra is reprovisioned. Production has moved
# to Vercel (de-backend-iota.vercel.app) — see deploy.yml and render.yaml.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy UAT → Azure Container Apps

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RESOURCE_GROUP: rg-dq-prod
  CONTAINER_APP: ca-dq-uat

jobs:
  build-and-deploy:
    name: Build → Push → Deploy (Azure)
    if: vars.DEPLOY_PROVIDER == 'azure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:uat-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:uat-${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps (UAT)
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:uat-${{ github.sha }}
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}

      - name: Health check
        run: |
          sleep 30
          curl -f https://ca-dq-uat.ashysea-f5376b70.centralindia.azurecontainerapps.io/health \
            || (echo "UAT health check failed" && exit 1)
