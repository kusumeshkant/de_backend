# ─────────────────────────────────────────────────────────────────────────────
# DISABLED 2026-07-16 — Azure subscription hosting rg-dq-prod / ca-dq-backend
# no longer exists (DNS NXDOMAIN on the Container App hostname, `az group show`
# returns SubscriptionNotFound, last successful deploy was 2026-05-09, the two
# attempts since then both failed at `npm install`). Production now runs on
# Vercel (de-backend-iota.vercel.app, deployed via Vercel's own git integration —
# not this workflow). Trigger changed to manual-only so this stops failing
# silently on every push to main. Re-enable the push trigger only if Azure
# infra is provisioned again.
# ─────────────────────────────────────────────────────────────────────────────
name: Build and Deploy to Azure Container Apps

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RESOURCE_GROUP: rg-dq-prod
  CONTAINER_APP: ca-dq-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}

      - name: Health check
        run: |
          sleep 30
          curl -f https://ca-dq-backend.ashysea-f5376b70.centralindia.azurecontainerapps.io/health \
            || (echo "Health check failed" && exit 1)
