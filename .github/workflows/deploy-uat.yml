# ─────────────────────────────────────────────────────────────────────────────
# LEGACY — manual-only emergency trigger.
# Automatic UAT deploys now go through deploy-azure-uat.yml (DEPLOY_PROVIDER=azure)
# or deploy-render-uat.yml (DEPLOY_PROVIDER=render).
# This file is preserved so Azure UAT can be force-triggered manually at any
# time regardless of the active DEPLOY_PROVIDER setting.
#
# STATUS 2026-07-16: the Azure subscription hosting rg-dq-prod is gone
# (see deploy.yml). This workflow will fail until/unless Azure infra is
# reprovisioned. DEPLOY_PROVIDER is currently set to 'render'.
# ─────────────────────────────────────────────────────────────────────────────
name: Build and Deploy to Azure Container Apps (UAT) — Manual

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual Azure UAT deploy"
        required: false
        default: "Emergency / override"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RESOURCE_GROUP: rg-dq-prod
  CONTAINER_APP: ca-dq-uat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:uat-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:uat-${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps (UAT)
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:uat-${{ github.sha }}
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}

      - name: Health check
        run: |
          sleep 30
          curl -f https://ca-dq-uat.ashysea-f5376b70.centralindia.azurecontainerapps.io/health \
            || (echo "UAT health check failed" && exit 1)
